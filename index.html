<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruptura por Partnumber</title>
<style>
  :root{
    --bg:#12151a;--panel:#1a1e26;--panel-2:#202430;--border:#2b3040;--border-soft:#232733;
    --text:#e9eaed;--text-dim:#9096a5;--text-faint:#656c7c;
    --brand:#ff6a3d;--ok:#34d1a0;--ok-dim:#113328;--warn:#ffb020;--warn-dim:#3a2b0c;
    --risk:#ff4d5e;--risk-dim:#3a1418;--risk2:#ff8a3d;--risk2-dim:#3a230c;
    --mono:'SF Mono','IBM Plex Mono',Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Roboto,sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  #app{display:flex;min-height:100vh;}
  #sidebar{width:210px;flex:0 0 210px;background:var(--panel);border-right:1px solid var(--border-soft);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;}
  .brand-row{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;border-bottom:1px solid var(--border-soft);margin-bottom:14px;}
  .brand-mark{width:10px;height:10px;background:var(--brand);border-radius:2px;flex:0 0 auto;}
  .brand-title{font-size:13px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;}
  .brand-sub{font-size:10px;color:var(--text-faint);margin-top:1px;}
  .navgroup-label{font-size:10px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.6px;padding:14px 10px 6px;}
  .navbtn{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--text-dim);border:1px solid transparent;user-select:none;}
  .navbtn:hover{background:var(--panel-2);color:var(--text);}
  .navbtn.active{background:var(--panel-2);color:var(--text);border-color:var(--border);}
  .navdot{width:8px;height:8px;border-radius:2px;flex:0 0 auto;background:var(--text-faint);}
  .navbtn.active .navdot{background:var(--brand);}
  .navbadge{margin-left:auto;font-size:10px;font-family:var(--mono);color:var(--text-faint);background:var(--panel);border:1px solid var(--border-soft);padding:1px 6px;border-radius:10px;}
  .navbadge.risk{color:var(--risk);border-color:var(--risk-dim);background:var(--risk-dim);}
  .navbadge.warn{color:var(--warn);border-color:var(--warn-dim);background:var(--warn-dim);}
  #main{flex:1;padding:26px 32px 60px;max-width:1200px;}
  .page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
  .page-title{font-size:20px;font-weight:700;margin:0;}
  .page-sub{font-size:12.5px;color:var(--text-dim);margin-top:4px;}
  .updated{font-size:11px;color:var(--text-faint);font-family:var(--mono);}
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:22px;}
  .kpi{background:var(--panel);border:1px solid var(--border-soft);border-radius:10px;padding:14px 16px;}
  .kpi-label{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.5px;}
  .kpi-val{font-size:24px;font-weight:700;margin-top:6px;font-family:var(--mono);}
  .kpi-val.risk{color:var(--risk);}.kpi-val.warn{color:var(--warn);}.kpi-val.ok{color:var(--ok);}
  .kpi-foot{font-size:11px;color:var(--text-dim);margin-top:4px;}
  .panel{background:var(--panel);border:1px solid var(--border-soft);border-radius:10px;padding:18px 20px;margin-bottom:20px;}
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
  .panel-title{font-size:13.5px;font-weight:700;margin:0;}
  .panel-note{font-size:11.5px;color:var(--text-faint);}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media(max-width:980px){.grid-3{grid-template-columns:1fr;}}
  @media(max-width:820px){
    .grid-2{grid-template-columns:1fr;}
    #app{flex-direction:column;}
    #sidebar{position:static;width:100%;flex:none;height:auto;flex-direction:row;align-items:center;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border-soft);padding:10px 12px;gap:6px;}
    .brand-row{border-bottom:none;margin-bottom:0;padding:4px 10px 4px 2px;flex:0 0 auto;}
    .navgroup-label{display:none;}
    .navbtn{flex:0 0 auto;white-space:nowrap;}
    #main{padding:18px 16px 60px;}
  }
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;color:var(--text-faint);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;padding:6px 8px;border-bottom:1px solid var(--border-soft);white-space:nowrap;}
  td{padding:7px 8px;border-bottom:1px solid var(--border-soft);color:var(--text);}
  tr:last-child td{border-bottom:none;}
  td.num{font-family:var(--mono);text-align:right;white-space:nowrap;}
  td.code{font-family:var(--mono);color:var(--text-dim);white-space:nowrap;}
  .rank{display:inline-block;width:18px;color:var(--text-faint);font-family:var(--mono);}
  .bar-wrap{display:inline-block;width:56px;height:5px;background:var(--border-soft);border-radius:3px;overflow:hidden;vertical-align:middle;margin-right:8px;}
  .bar{height:100%;border-radius:3px;}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap;}
  .pill.risk{background:var(--risk-dim);color:var(--risk);}
  .pill.risk2{background:var(--risk2-dim);color:var(--risk2);}
  .pill.warn{background:var(--warn-dim);color:var(--warn);}
  .pill.ok{background:var(--ok-dim);color:var(--ok);}
  .pill.chassis{background:#5b8def22;color:#5b8def;}
  .pill.trim{background:#c879ff22;color:#c879ff;}
  .pill.body{background:#34d1bf22;color:#34d1bf;}
  .pill.pwt{background:#ff9f4322;color:#ff9f43;}
  .pill.outra{background:#9096a522;color:#9096a5;}
  select,input,textarea,button{font-family:var(--sans);font-size:12.5px;}
  select,input[type=text],input[type=number],input[type=date]{background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:7px 9px;}
  select:focus,input:focus,textarea:focus{outline:none;border-color:var(--brand);}
  textarea{background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px;width:100%;font-family:var(--mono);font-size:11.5px;resize:vertical;}
  button{background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:600;}
  button:hover{border-color:var(--text-dim);}
  button.primary{background:var(--brand);border-color:var(--brand);color:#2b1409;}
  button.primary:hover{background:#ff7f57;}
  button.danger{background:var(--risk-dim);border-color:var(--risk);color:var(--risk);}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  .field-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;align-items:flex-end;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.4px;}
  .searchbar{display:flex;gap:8px;margin-bottom:10px;}
  .searchbar input{flex:1;}
  .empty{padding:30px;text-align:center;color:var(--text-faint);font-size:12.5px;}
  .msg{font-size:12px;padding:10px 12px;border-radius:8px;margin-top:10px;}
  .msg.ok{background:var(--ok-dim);color:var(--ok);}
  .msg.err{background:var(--risk-dim);color:var(--risk);}
  .scrollx{overflow-x:auto;}
  ::-webkit-scrollbar{height:8px;width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  .tag-etapa{font-size:10px;color:var(--text-faint);font-family:var(--mono);}
  .idea-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;}
  .idea{background:var(--panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:12px 14px;}
  .idea-title{font-size:12.5px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:6px;}
  .idea-title .navdot{background:var(--brand);}
  .idea-text{font-size:11.5px;color:var(--text-dim);line-height:1.5;}
  th.sortable{cursor:pointer;}
  th.sortable:hover{color:var(--text);}
</style>
</head>

    <div class="brand-row">

</div>

const AREAS = ['Chassis','Trim','Body','Pwt'];
const AREA_CLASS = {Chassis:'chassis',Trim:'trim',Body:'body',Pwt:'pwt'};
function normalizeArea(v){
  if(!v) return null;
  const s = v.toString().trim().toLowerCase();
  if(s.startsWith('chas')) return 'Chassis';
  if(s.startsWith('trim')) return 'Trim';
  if(s.startsWith('body')||s.startsWith('carro')) return 'Body';
  if(s.startsWith('pwt')||s.startsWith('power')||s.startsWith('motor')) return 'Pwt';
  return v.toString().trim();
}

let records = [];
let cadastro = [];
let settings = { minimoPadrao: 20, horizonteDias: 30 };
let view = 'overview';
let todosSort = {col:'risco', dir:'asc'};
let naoContadosSearch = '';

const KEY_RECORDS = 'inventario:registros';
const KEY_SETTINGS = 'inventario:config';
const KEY_CADASTRO = 'inventario:cadastro';

async function loadAll(){
  try{ const r = await window.storage.get(KEY_RECORDS, false); records = r && r.value ? JSON.parse(r.value) : []; }
  catch(e){ records = []; }
  try{ const s = await window.storage.get(KEY_SETTINGS, false); if(s && s.value) settings = Object.assign(settings, JSON.parse(s.value)); }
  catch(e){}
  try{
    const c = await window.storage.get(KEY_CADASTRO, false);
    cadastro = c && c.value ? JSON.parse(c.value) : [];
  }catch(e){ cadastro = []; }
  if(!cadastro.length){
    cadastro = PN_MASTER_LIST.map(codigo=>({codigo}));
    await saveCadastro();
  }
  render();
}
async function saveRecords(){ try{ await window.storage.set(KEY_RECORDS, JSON.stringify(records), false); }catch(e){ console.error(e); } }
async function saveSettings(){ try{ await window.storage.set(KEY_SETTINGS, JSON.stringify(settings), false); }catch(e){ console.error(e); } }
async function saveCadastro(){ try{ await window.storage.set(KEY_CADASTRO, JSON.stringify(cadastro), false); }catch(e){ console.error(e); } }

function uid(){ return 'r'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function fmt(n){ return Number(n||0).toLocaleString('pt-BR'); }
function daysSince(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return null;
  return Math.floor((Date.now()-d.getTime())/86400000);
}

/* ---------- core aggregation: one row per Partnumber ---------- */
function buildPNStats(){
  const byPN = new Map();
  for(const r of records){
    if(!byPN.has(r.codigo)) byPN.set(r.codigo, []);
    byPN.get(r.codigo).push(r);
  }
  const stats = [];
  for(const [codigo, list] of byPN.entries()){
    const contagens = list.length;
    const comData = list.filter(x=>x.data).sort((a,b)=> a.data<b.data?-1:1);
    const ultimaContagem = comData.length ? comData[comData.length-1].data : null;
    const currentQty = comData.length ? comData[comData.length-1].quantidade : list[list.length-1].quantidade;
    const minCandidates = list.map(x=>x.minimo).filter(v=>v!=null);
    const minimo = minCandidates.length ? minCandidates[minCandidates.length-1] : null;
    const minUsado = minimo!=null ? minimo : settings.minimoPadrao;
    const areaCandidates = list.map(x=>x.area).filter(Boolean);
    const area = areaCandidates.length ? areaCandidates[areaCandidates.length-1] : null;

    let trendPerDay = null, diasProjecao = null;
    if(comData.length>=2){
      const t0 = new Date(comData[0].data+'T00:00:00').getTime();
      const pts = comData.map(x=>({t:(new Date(x.data+'T00:00:00').getTime()-t0)/86400000, y:Number(x.quantidade)||0}));
      const n = pts.length;
      const sumT = pts.reduce((s,p)=>s+p.t,0), sumY = pts.reduce((s,p)=>s+p.y,0);
      const sumTT = pts.reduce((s,p)=>s+p.t*p.t,0), sumTY = pts.reduce((s,p)=>s+p.t*p.y,0);
      const denom = (n*sumTT - sumT*sumT);
      if(denom!==0){
        trendPerDay = (n*sumTY - sumT*sumY)/denom;
        if(trendPerDay < -0.01 && currentQty>0){
          diasProjecao = Math.round(currentQty/(-trendPerDay));
        }
      }
    }

    let riscoDias, situacao, sevClass;
    if(currentQty!=null && currentQty<=0){
      riscoDias = 0; situacao='Ruptura atual'; sevClass='risk';
    } else if(currentQty!=null && currentQty<=minUsado){
      riscoDias = 0; situacao='Abaixo do mínimo'; sevClass='risk';
    } else if(diasProjecao!=null){
      riscoDias = diasProjecao;
      if(diasProjecao<=7){ situacao='Queda acentuada'; sevClass='risk'; }
      else if(diasProjecao<=settings.horizonteDias){ situacao='Em queda'; sevClass='risk2'; }
      else { situacao='Tendência de queda'; sevClass='warn'; }
    } else {
      riscoDias = null; situacao='Estável'; sevClass='ok';
    }

    stats.push({codigo, area, contagens, ultimaContagem, currentQty, minimo, minUsado, trendPerDay, diasProjecao, riscoDias, situacao, sevClass});
  }
  return stats;
}

function buildAreaStats(stats){
  const map = new Map();
  for(const a of AREAS) map.set(a, {area:a, pns:0, contagens:0, risco:0});
  for(const s of stats){
    const key = s.area || 'Outra';
    if(!map.has(key)) map.set(key, {area:key, pns:0, contagens:0, risco:0});
    const item = map.get(key);
    item.pns += 1;
    item.contagens += s.contagens;
    if(s.riscoDias!=null) item.risco += 1;
  }
  return Array.from(map.values()).filter(a=> a.pns>0 || AREAS.includes(a.area));
}

function coverage(stats){
  const total = cadastro.length || stats.length;
  return {distinctCounted: stats.length, total, pct: total? Math.min(100, Math.round(stats.length/total*100)) : 0};
}
function naoContadosList(){
  if(!cadastro.length) return [];
  const contadosSet = new Set(records.map(r=>r.codigo));
  return cadastro.filter(c=> !contadosSet.has(c.codigo));
}

/* ---------- render shell ---------- */
function render(){
  document.querySelectorAll('.navbtn').forEach(b=> b.classList.toggle('active', b.dataset.view===view));
  document.getElementById('sb-total').textContent = fmt(cadastro.length)+' partnumbers';
  const stats = buildPNStats();
  const riscoCount = stats.filter(s=> s.riscoDias!=null).length;
  document.getElementById('nav-badge-risco').textContent = riscoCount;
  const naoContados = naoContadosList();
  document.getElementById('nav-badge-naocontados').textContent = naoContados.length;
  const main = document.getElementById('main');
  if(view==='overview') main.innerHTML = renderOverview(stats);
  else if(view==='ruptura') main.innerHTML = renderRuptura(stats);
  else if(view==='contagens') main.innerHTML = renderContagens(stats);
  else if(view==='todos') main.innerHTML = renderTodos(stats);
  else if(view==='naocontados') main.innerHTML = renderNaoContados(stats);
  else if(view==='importar') main.innerHTML = renderImportar();
  bindMainEvents(stats);
}

function pageHead(title, sub){
  return `<div class="page-head">
    <div><h1 class="page-title">${title}</h1><div class="page-sub">${sub}</div></div>
    <div class="updated">Atualizado: ${new Date().toLocaleString('pt-BR')}</div>
  </div>`;
}
function sevPill(s){ return `<span class="pill ${s.sevClass}">${s.situacao}</span>`; }
function areaPill(area){
  if(!area) return '<span class="tag-etapa">—</span>';
  const cls = AREA_CLASS[area] || 'outra';
  return `<span class="pill ${cls}">${area}</span>`;
}
function riscoCell(s){
  if(s.riscoDias==null) return '<span class="tag-etapa">—</span>';
  if(s.riscoDias===0) return '<span class="tag-etapa">agora</span>';
  return `~${fmt(s.riscoDias)}d`;
}

/* ---------- overview ---------- */

  const risco = stats.filter(s=>s.riscoDias!=null).sort((a,b)=> a.riscoDias-b.riscoDias).slice(0,10);
  const maisContadas = [...stats].sort((a,b)=>b.contagens-a.contagens).slice(0,10);
  const menosContadas = [...stats].sort((a,b)=>a.contagens-b.contagens).slice(0,10);
  const totalContagens = records.length;
  const naoContados = naoContadosList();

  const kpis = `<div class="kpi-row">
    <div class="kpi"><div class="kpi-label">Partnumbers cadastrados</div><div class="kpi-val">${fmt(cadastro.length)}</div><div class="kpi-foot">total a acompanhar</div></div>
    <div class="kpi"><div class="kpi-label">Já contados</div><div class="kpi-val ${cov.pct<50?'warn':'ok'}">${fmt(cov.distinctCounted)}</div><div class="kpi-foot">${cov.pct}% de cobertura</div></div>
    <div class="kpi"><div class="kpi-label">Contagens lançadas</div><div class="kpi-val">${fmt(totalContagens)}</div><div class="kpi-foot">registros no total</div></div>
    <div class="kpi"><div class="kpi-label">Em risco de ruptura</div><div class="kpi-val risk">${fmt(stats.filter(s=>s.riscoDias!=null).length)}</div><div class="kpi-foot">projeção ≤ ${settings.horizonteDias}d ou já abaixo do mínimo</div></div>
    <div class="kpi"><div class="kpi-label">Nunca contados</div><div class="kpi-val warn">${fmt(naoContados.length)}</div><div class="kpi-foot">do cadastro mestre</div></div>
  </div>`;

  const maxContagem = Math.max(1, ...stats.map(s=>s.contagens));
  const miniTable = (list, barColor)=> list.length ? `
    <table><thead><tr><th></th><th>Partnumber</th><th style="text-align:right">Contagens</th></tr></thead><tbody>
    ${list.map((s,i)=>`<tr>
      <td class="rank">${i+1}</td>
      <td class="code">${s.codigo}</td>
      <td class="num"><span class="bar-wrap"><span class="bar" style="width:${Math.round(Math.min(100,(s.contagens/maxContagem)*100))}%;background:${barColor}"></span></span>${fmt(s.contagens)}</td>
    </tr>`).join('')}</tbody></table>` : `<div class="empty">Sem dados ainda.</div>`;

  const areaStats = buildAreaStats(stats);
  const areaKpis = areaStats.length ? `<div class="kpi-row">
    ${areaStats.map(a=>`<div class="kpi">
      <div class="kpi-label">${areaPill(a.area)}</div>
      <div class="kpi-val ${a.risco>0?'risk':''}">${fmt(a.pns)}</div>
      <div class="kpi-foot">PNs contados · ${fmt(a.contagens)} contagens · ${fmt(a.risco)} em risco</div>
    </div>`).join('')}
  </div>` : `<div class="empty">Sem dados ainda — a área vem de cada contagem lançada em "Importar / lançar".</div>`;

  return pageHead('Visão geral', 'Projeção de ruptura e cobertura de contagem por partnumber')
    + kpis
    + `<div class="grid-3">
        <div class="panel">
          <div class="panel-head"><h3 class="panel-title">Top 10 maiores riscos de ruptura</h3></div>
          ${risco.length ? `<table><thead><tr><th></th><th>PN</th><th style="text-align:right">Projeção</th></tr></thead><tbody>
            ${risco.map((s,i)=>`<tr><td class="rank">${i+1}</td><td class="code">${s.codigo}</td><td class="num">${riscoCell(s)}</td></tr>`).join('')}
          </tbody></table>` : `<div class="empty">Nenhum risco identificado com os dados atuais.</div>`}
        </div>
        <div class="panel">
          <div class="panel-head"><h3 class="panel-title">Top 10 mais contados</h3></div>
          ${miniTable(maisContadas, 'var(--ok)')}
        </div>
        <div class="panel">
          <div class="panel-head"><h3 class="panel-title">Top 10 menos contados</h3></div>
          ${miniTable(menosContadas, 'var(--warn)')}
        </div>
      </div>`
    + `<div class="panel">
        <div class="panel-head"><h3 class="panel-title">Por área</h3><span class="panel-note">Chassis, Trim, Body, Pwt</span></div>
        ${areaKpis}
      </div>`
    + `<div class="panel">
        <div class="panel-head"><h3 class="panel-title">Como a projeção é calculada</h3></div>
        <div class="idea-list">
          <div class="idea"><div class="idea-title"><span class="navdot"></span>Já abaixo do mínimo</div><div class="idea-text">Se a última contagem do PN está no mínimo ou abaixo, ele entra direto como risco "agora".</div></div>
          <div class="idea"><div class="idea-title"><span class="navdot"></span>Tendência de queda</div><div class="idea-text">Com 2+ contagens em datas diferentes para o mesmo PN, calculo a taxa de queda e projeto em quantos dias ele chega a zero.</div></div>
          <div class="idea"><div class="idea-title"><span class="navdot"></span>Sem dado suficiente</div><div class="idea-text">PN com uma única contagem aparece como "Estável" até você lançar uma segunda contagem — aí a tendência real aparece.</div></div>
        </div>
      </div>`
    + settingsPanel();
}

function settingsPanel(){
  return `<div class="panel">
    <div class="panel-head"><h3 class="panel-title">Parâmetros</h3></div>
    <div class="field-row">
      <div class="field"><label>Estoque mínimo padrão</label><input type="number" id="cfg-min" value="${settings.minimoPadrao}" style="width:130px"></div>
      <div class="field"><label>Horizonte de risco (dias)</label><input type="number" id="cfg-horiz" value="${settings.horizonteDias}" style="width:130px"></div>

    </div>

}

/* ---------- ruptura ---------- */
function renderRuptura(stats){
  const withRisk = stats.filter(s=>s.riscoDias!=null).sort((a,b)=>a.riscoDias-b.riscoDias);
  const rows = withRisk.length ? withRisk.map((s,i)=>`
    <tr>
      <td class="rank">${i+1}</td>
      <td class="code">${s.codigo}</td>
      <td>${areaPill(s.area)}</td>
      <td class="num">${s.currentQty!=null?fmt(s.currentQty):'—'}</td>
      <td class="num">${fmt(s.minUsado)}</td>
      <td class="num">${riscoCell(s)}</td>
      <td>${sevPill(s)}</td>
    </tr>`).join('') : `<tr><td colspan="7"><div class="empty">Nenhum partnumber em risco com os dados atuais.</div></td></tr>`;

  return pageHead('Risco de ruptura', 'Todos os partnumbers ordenados pela projeção de ruptura, do mais urgente ao mais tranquilo')
    + `<div class="panel">
        <div class="panel-head"><h3 class="panel-title">Ranking completo</h3><span class="panel-note">${fmt(withRisk.length)} partnumber(s) sinalizados</span></div>
        <div class="scrollx"><table><thead><tr><th></th><th>PN</th><th>Área</th><th style="text-align:right">Qtd atual</th><th style="text-align:right">Mínimo</th><th style="text-align:right">Projeção</th><th>Situação</th></tr></thead><tbody>${rows}</tbody></table></div>
      </div>`;
}

/* ---------- contagens ---------- */
function renderContagens(stats){
  const mais = [...stats].sort((a,b)=>b.contagens-a.contagens).slice(0,10);
  const menos = [...stats].sort((a,b)=>a.contagens-b.contagens).slice(0,10);
  const maxC = Math.max(1, ...stats.map(s=>s.contagens));
  const rowsOf = (list)=> list.length ? list.map((s,i)=>`
    <tr>
      <td class="rank">${i+1}</td>
      <td class="code">${s.codigo}</td>
      <td>${areaPill(s.area)}</td>
      <td class="num"><span class="bar-wrap"><span class="bar" style="width:${Math.round((s.contagens/maxC)*100)}%;background:var(--brand)"></span></span>${fmt(s.contagens)}</td>
      <td class="num">${s.ultimaContagem||'—'}</td>
      <td class="num">${s.ultimaContagem?fmt(daysSince(s.ultimaContagem))+'d atrás':'—'}</td>
    </tr>`).join('') : `<tr><td colspan="6"><div class="empty">Sem dados ainda.</div></td></tr>`;

  return pageHead('Contagens por partnumber', 'Frequência de contagem — quantas vezes cada PN já foi contado e há quanto tempo')
    + `<div class="grid-2">
        <div class="panel">
          <div class="panel-head"><h3 class="panel-title">Top 10 mais contados</h3></div>
          <div class="scrollx"><table><thead><tr><th></th><th>PN</th><th>Área</th><th style="text-align:right">Contagens</th><th>Última</th><th style="text-align:right">Há quanto tempo</th></tr></thead><tbody>${rowsOf(mais)}</tbody></table></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h3 class="panel-title">Top 10 menos contados</h3></div>
          <div class="scrollx"><table><thead><tr><th></th><th>PN</th><th>Área</th><th style="text-align:right">Contagens</th><th>Última</th><th style="text-align:right">Há quanto tempo</th></tr></thead><tbody>${rowsOf(menos)}</tbody></table></div>
        </div>
      </div>`;
}

/* ---------- todos ---------- */
function renderTodos(stats){
  const col = todosSort.col, dir = todosSort.dir;
  const valFn = {
    codigo: s=>s.codigo, contagens: s=>s.contagens, qtd: s=> s.currentQty??-1,
    minimo: s=>s.minUsado, risco: s=> s.riscoDias==null?999999:s.riscoDias, ultima: s=> s.ultimaContagem||''
  }[col] || (s=>s.codigo);
  let list = [...stats].sort((a,b)=>{
    const va=valFn(a), vb=valFn(b);
    if(va<vb) return dir==='asc'?-1:1;
    if(va>vb) return dir==='asc'?1:-1;
    return 0;
  });
  const arrow = c => c===col ? (dir==='asc'?' ▲':' ▼') : '';
  const rows = list.length ? list.map(s=>`
    <tr>
      <td class="code">${s.codigo}</td>
      <td>${areaPill(s.area)}</td>
      <td class="num">${fmt(s.contagens)}</td>
      <td class="num">${s.currentQty!=null?fmt(s.currentQty):'—'}</td>
      <td class="num">${fmt(s.minUsado)}</td>
      <td class="num">${riscoCell(s)}</td>
      <td>${sevPill(s)}</td>
      <td class="num">${s.ultimaContagem||'—'}</td>
      <td><button class="del-pn" data-codigo="${s.codigo}">Remover</button></td>
    </tr>`).join('') : `<tr><td colspan="9"><div class="empty">Nenhum partnumber encontrado.</div></td></tr>`;

  return pageHead('Todos os partnumbers', 'Base completa com contagens, quantidade atual e projeção de ruptura')
    + `<div class="panel">
        <div class="field-row">
          <div class="field" style="flex:1;min-width:200px"><label>Buscar</label><input type="text" id="todos-search" placeholder="Código..."></div>
        </div>
        <div class="scrollx"><table id="todos-table"><thead><tr>
          <th class="sortable" data-col="codigo">PN</th>
          <th>Área</th>
          <th class="sortable" data-col="contagens" style="text-align:right">Contagens${arrow('contagens')}</th>
          <th class="sortable" data-col="qtd" style="text-align:right">Qtd atual${arrow('qtd')}</th>
          <th class="sortable" data-col="minimo" style="text-align:right">Mínimo${arrow('minimo')}</th>
          <th class="sortable" data-col="risco" style="text-align:right">Projeção${arrow('risco')}</th>
          <th>Situação</th>
          <th class="sortable" data-col="ultima">Última${arrow('ultima')}</th>
          <th></th>
        </tr></thead><tbody>${rows}</tbody></table></div>
      </div>`;
}

/* ---------- não contados ---------- */
function renderNaoContados(stats){
  const lista = naoContadosList();

  const filtered = q ? lista.filter(c=> c.codigo.toLowerCase().includes(q)) : lista;

  return pageHead('Ainda não contados', `${fmt(lista.length)} de ${fmt(cadastro.length)} partnumbers do cadastro mestre sem nenhuma contagem lançada`)
    + `<div class="panel">
        <div class="panel-head"><h3 class="panel-title">Pendentes de contagem</h3></div>
        <div class="searchbar"><input type="text" id="nc-search" placeholder="Buscar por código..." value="${naoContadosSearch}"></div>
        <div class="scrollx"><table><thead><tr><th>PN</th></tr></thead><tbody>${rows}</tbody></table></div>
      </div>`;
}

/* ---------- importar ---------- */
function renderImportar(){
  return pageHead('Importar / lançar contagens', 'Cole a tabela do Excel e o painel recalcula tudo automaticamente')
    + `<div class="panel">
        <div class="panel-head"><h3 class="panel-title">Importar contagens (colar do Excel)</h3></div>
        <div class="panel-note" style="margin-bottom:8px">Cole as linhas direto do Excel (Tab, ; ou ,), nesta ordem: <b style="color:var(--text)">partnumber, área, quantidade, mínimo (opcional), data (opcional, AAAA-MM-DD)</b>. Cabeçalho é detectado automaticamente. Área aceita Chassis, Trim, Body ou Pwt. <b style="color:var(--warn)">Só são importadas linhas cujo partnumber já está nos ${fmt(cadastro.length)} PNs cadastrados</b> — o resto é listado como ignorado.</div>
        <textarea id="imp-text" rows="8" placeholder="PN	Área	Quantidade	Mínimo	Data
01225S809E	Chassis	48	20	2026-08-01
01225S809E	Chassis	31	20	2026-08-08
10005ED00A	Trim	12		2026-08-06"></textarea>
        <div class="btn-row" style="margin-top:10px">
          <button class="primary" id="imp-run">Importar linhas</button>
          <button id="imp-clear">Limpar campo</button>
        </div>
        <div id="imp-msg"></div>
      </div>`
    + `<div class="panel">
        <div class="panel-head"><h3 class="panel-title">Lançar um partnumber</h3></div>
        <div class="field-row">
          <div class="field"><label>Partnumber</label><input type="text" id="one-codigo" placeholder="01225S809E" style="width:160px"></div>

          <div class="field"><label>Quantidade</label><input type="number" id="one-qtd" style="width:100px"></div>
          <div class="field"><label>Mínimo (opcional)</label><input type="number" id="one-min" style="width:100px"></div>
          <div class="field"><label>Data da contagem</label><input type="date" id="one-data" value="${new Date().toISOString().slice(0,10)}"></div>
          <button class="primary" id="one-run">Lançar</button>
        </div>
        <div class="panel-note">Só aceita partnumbers que já estão no cadastro de ${fmt(cadastro.length)}.</div>
        <div id="one-msg"></div>
      </div>`
    + `<div class="panel">
        <div class="panel-head"><h3 class="panel-title">Cadastro mestre de partnumbers</h3><span class="panel-note">${fmt(cadastro.length)} PNs cadastrados</span></div>
        <div class="panel-note" style="margin-bottom:8px">Os ${fmt(cadastro.length)} partnumbers que você enviou já estão carregados. Se precisar adicionar mais códigos ao cadastro, cole aqui (um por linha, ou uma coluna de uma tabela).</div>
        <textarea id="cad-text" rows="4" placeholder="AB1234
AB1235
AB1236"></textarea>
        <div class="btn-row" style="margin-top:10px">
          <button class="primary" id="cad-run">Adicionar ao cadastro</button>
          <button id="cad-clear-field">Limpar campo</button>
          <button class="danger" id="cad-reset">Restaurar cadastro original (2.653 PNs)</button>
        </div>
        <div id="cad-msg"></div>
      </div>`
    + `<div class="panel">
        <div class="panel-head"><h3 class="panel-title">Dados armazenados</h3></div>
        <div class="panel-note" style="margin-bottom:10px">${fmt(records.length)} contagens salvas neste dispositivo, cobrindo ${fmt(buildPNStats().length)} partnumbers distintos.</div>
        <div class="btn-row">
          <button id="exp-run">Exportar tudo como CSV</button>
          <button class="danger" id="reset-run">Apagar todas as contagens</button>

}

/* ---------- events ---------- */
function bindMainEvents(stats){
  const cfgSave = document.getElementById('cfg-save');
  if(cfgSave){
    cfgSave.addEventListener('click', async ()=>{
      settings.minimoPadrao = Number(document.getElementById('cfg-min').value)||settings.minimoPadrao;
      settings.horizonteDias = Number(document.getElementById('cfg-horiz').value)||settings.horizonteDias;
      await saveSettings();
      document.getElementById('cfg-msg').innerHTML = `<div class="msg ok">Parâmetros salvos.</div>`;
      render();
    });
  }

  const todosSearch = document.getElementById('todos-search');
  if(todosSearch) todosSearch.addEventListener('input', ()=>{
    const q = todosSearch.value.trim().toLowerCase();
    document.querySelectorAll('#todos-table tbody tr').forEach(tr=>{
      tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });
  document.querySelectorAll('#todos-table th.sortable').forEach(th=>{
    th.addEventListener('click', ()=>{
      const c = th.dataset.col;
      if(todosSort.col===c) todosSort.dir = todosSort.dir==='asc'?'desc':'asc';
      else { todosSort.col=c; todosSort.dir='asc'; }
      render();
    });
  });
  document.querySelectorAll('.del-pn').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const codigo = btn.dataset.codigo;
      records = records.filter(r=> r.codigo!==codigo);
      await saveRecords();
      render();
    });
  });

  const ncSearch = document.getElementById('nc-search');
  if(ncSearch) ncSearch.addEventListener('input', ()=>{ naoContadosSearch = ncSearch.value; render(); });

  const cadRun = document.getElementById('cad-run');
  if(cadRun){
    cadRun.addEventListener('click', async ()=>{
      const lines = document.getElementById('cad-text').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
      const existing = new Set(cadastro.map(c=>c.codigo));
      let novos = 0;
      for(const line of lines){
        const codigo = line.split(/[\t;,]/)[0].trim().replace(/^"|"$/g,'');
        if(codigo && !existing.has(codigo)){ cadastro.push({codigo}); existing.add(codigo); novos++; }
      }
      await saveCadastro();
      document.getElementById('cad-msg').innerHTML = `<div class="msg ${novos>0?'ok':'err'}">${novos} novo(s) partnumber(s) adicionados ao cadastro. Total agora: ${fmt(cadastro.length)}.</div>`;
      const ta = document.getElementById('cad-text'); if(ta) ta.value='';
      render();
    });
    document.getElementById('cad-clear-field').addEventListener('click', ()=>{ document.getElementById('cad-text').value=''; });
    let confirmingCad = false;
    document.getElementById('cad-reset').addEventListener('click', async ()=>{
      const btn = document.getElementById('cad-reset');
      if(!confirmingCad){
        confirmingCad = true;
        btn.textContent = 'Clique de novo para confirmar';
        setTimeout(()=>{ confirmingCad=false; btn.textContent='Restaurar cadastro original (2.653 PNs)'; }, 4000);
        return;
      }
      cadastro = PN_MASTER_LIST.map(codigo=>({codigo}));
      await saveCadastro();
      document.getElementById('cad-msg').innerHTML = `<div class="msg ok">Cadastro restaurado para os 2.653 PNs originais.</div>`;
      render();
    });
  }

  const impRun = document.getElementById('imp-run');
  if(impRun){
    impRun.addEventListener('click', async ()=>{
      const res = importCSV(document.getElementById('imp-text').value);
      await saveRecords();
      document.getElementById('imp-msg').innerHTML = `<div class="msg ${res.novos+res.atualizados>0?'ok':'err'}">
        ${res.novos+res.atualizados} linha(s) processadas — ${res.novos} novas, ${res.atualizados} atualizadas.
        ${res.ignoradas?` ${res.ignoradas} linha(s) ignoradas (sem partnumber ou quantidade).`:''}
        ${res.naoCadastrados?` ${res.naoCadastrados} linha(s) com PN fora do cadastro de ${fmt(cadastro.length)} — não foram importadas.`:''}
      </div>`;
      const ta = document.getElementById('imp-text'); if(ta) ta.value='';
      view='overview'; render();
    });
    document.getElementById('imp-clear').addEventListener('click', ()=>{ document.getElementById('imp-text').value=''; });
  }

  const oneRun = document.getElementById('one-run');
  if(oneRun){
    oneRun.addEventListener('click', async ()=>{
      const codigo = document.getElementById('one-codigo').value.trim();
      const qtd = document.getElementById('one-qtd').value;
      if(!codigo || qtd===''){
        document.getElementById('one-msg').innerHTML = `<div class="msg err">Informe ao menos o partnumber e a quantidade.</div>`;
        return;
      }
      if(!cadastro.some(c=>c.codigo===codigo)){
        document.getElementById('one-msg').innerHTML = `<div class="msg err">"${codigo}" não está no cadastro de ${fmt(cadastro.length)} partnumbers. Verifique o código ou adicione-o no bloco "Cadastro mestre" abaixo.</div>`;
        return;
      }
      records.push({
        id: uid(), codigo, area: document.getElementById('one-area').value,
        quantidade: Number(qtd), minimo: document.getElementById('one-min').value!==''?Number(document.getElementById('one-min').value):null,
        data: document.getElementById('one-data').value || new Date().toISOString().slice(0,10)
      });
      await saveRecords();
      document.getElementById('one-msg').innerHTML = `<div class="msg ok">Lançado: ${codigo}.</div>`;
      ['one-codigo','one-qtd','one-min'].forEach(id=> document.getElementById(id).value='');
      render();
    });
  }

  const expRun = document.getElementById('exp-run');
  if(expRun) expRun.addEventListener('click', exportCSV);

  const resetRun = document.getElementById('reset-run');
  if(resetRun){
    let confirming = false;
    resetRun.addEventListener('click', async ()=>{
      if(!confirming){
        confirming = true;
        resetRun.textContent = 'Clique de novo para confirmar';
        document.getElementById('reset-msg').innerHTML = `<div class="msg err">Isso apaga todas as ${fmt(records.length)} contagens salvas. Ação irreversível.</div>`;
        setTimeout(()=>{ confirming=false; resetRun.textContent='Apagar todas as contagens'; }, 4000);
        return;
      }
      records = [];
      await saveRecords();
      document.getElementById('reset-msg').innerHTML = `<div class="msg ok">Contagens apagadas.</div>`;
      render();
    });
  }
}

function importCSV(text){
  let novos=0, atualizados=0, ignoradas=0, naoCadastrados=0;
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>0);
  if(!lines.length) return {novos,atualizados,ignoradas,naoCadastrados};
  let delim = '\t';
  if(!lines[0].includes('\t')) delim = lines[0].includes(';') ? ';' : ',';

  const headKeys = lines[0].toLowerCase().split(delim).map(s=>s.trim());
  const findCol = (names)=> headKeys.findIndex(h=> names.some(n=> h.includes(n)));
  let cIdx = findCol(['partnumber','part number','pn','codigo','código','sku','part']);
  let aIdx = findCol(['area','área']);
  let qIdx = findCol(['quant','qtd','count','contagem']);
  let mIdx = findCol(['min']);
  let tIdx = findCol(['data','date']);

  let startRow = 0;
  const hasHeader = cIdx>-1 || qIdx>-1;
  if(hasHeader){ startRow = 1; } else { cIdx=0; aIdx=1; qIdx=2; mIdx=3; tIdx=4; }

  const cadastroSet = new Set(cadastro.map(c=>c.codigo));

  for(let i=startRow;i<lines.length;i++){
    const cols = lines[i].split(delim).map(s=>s.trim().replace(/^"|"$/g,''));
    const codigo = cIdx>-1 ? cols[cIdx] : '';
    const qtdRaw = qIdx>-1 ? cols[qIdx] : '';
    if(!codigo || qtdRaw==='' || isNaN(Number(qtdRaw.replace(',','.')))){ ignoradas++; continue; }
    if(!cadastroSet.has(codigo)){ naoCadastrados++; continue; }
    const area = normalizeArea(aIdx>-1?cols[aIdx]:'') || null;
    const data = (tIdx>-1 && cols[tIdx]) ? cols[tIdx] : new Date().toISOString().slice(0,10);
    const existed = records.some(r=> r.codigo===codigo && r.data===data);
    records.push({
      id: uid(), codigo, area,
      quantidade: Number(qtdRaw.replace(',','.')),
      minimo: (mIdx>-1 && cols[mIdx]!=='') ? Number(cols[mIdx].replace(',','.')) : null,
      data
    });
    existed ? atualizados++ : novos++;
  }
  return {novos,atualizados,ignoradas,naoCadastrados};
}

function exportCSV(){
  const header = ['partnumber','area','quantidade','minimo','data'];
  const rows = records.map(r=> [r.codigo,r.area||'',r.quantidade,r.minimo??'',r.data||''].join(';'));
  const csv = header.join(';')+'\n'+rows.join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'contagens_export.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.querySelectorAll('.navbtn').forEach(b=>{
  b.addEventListener('click', ()=>{ view = b.dataset.view; render(); });
});

loadAll();
</script>
